<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RubickShop - Обратная связь</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ШАПКА -->
<header class="header">
    <div class="header-left">
        <a href="index.html" class="logo-link"><h1 class="logo">RubickShop</h1></a>
    </div>
    <nav class="header-center">
        <ul>
            <li><a href="index.html">Главная</a></li>
        </ul>
    </nav>
</header>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div style="display:flex;justify-content:center;align-items:center;min-height:80vh;">
    <form style="background:white;padding:2rem;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);width:100%;max-width:400px;display:flex;flex-direction:column;gap:1rem;">
        <h2 style="text-align:center;color:#166534;">Свяжитесь с нами</h2>
        <input type="text" placeholder="Ваше имя" style="padding:0.6rem;border-radius:6px;border:1px solid #ccc;font-size:1rem;">
        <input type="email" placeholder="Email" style="padding:0.6rem;border-radius:6px;border:1px solid #ccc;font-size:1rem;">
        <textarea placeholder="Сообщение" rows="5" style="padding:0.6rem;border-radius:6px;border:1px solid #ccc;font-size:1rem;"></textarea>
        <button type="submit" style="padding:0.7rem;background:#16a34a;color:white;border:none;border-radius:6px;font-size:1rem;cursor:pointer;">Отправить</button>
    </form>
</div>

<!-- ФУТЕР -->
<footer class="footer">
    <p>© 2026 RubickShop. Все права защищены.</p>
</footer>

</body>
</html>
